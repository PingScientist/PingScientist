<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 152" role="img" aria-labelledby="title desc">
  <title id="title">Contact signal</title>
  <desc id="desc">A compact animated data signal linking GitHub, PingScientist, and email.</desc>

  <style>
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .frame { fill: #07111f; stroke: #18374a; }
    .node { fill: #0b1827; stroke: #245268; }
    .label { fill: #f4f7f8; }
    .meta { fill: #91a9b8; }
    .track { fill: none; stroke: #245268; stroke-width: 2; }
    .signal-cyan {
      fill: none;
      stroke: #42d6c5;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 12 12;
      animation: signal-flow 4s linear infinite;
    }
    .signal-gold {
      fill: none;
      stroke: #c7a85a;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-dasharray: 4 16;
      animation: signal-flow 5s linear infinite reverse;
    }
    .packet {
      animation: packet-pulse 2.4s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .status { animation: status-blink 2.8s steps(2, end) infinite; }
    @keyframes signal-flow {
      to { stroke-dashoffset: -96; }
    }
    @keyframes packet-pulse {
      0%, 100% { opacity: 0.45; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1); }
    }
    @keyframes status-blink {
      50% { opacity: 0.35; }
    }
    @media (prefers-color-scheme: light) {
      .frame { stroke: #2d6377; }
      .node { stroke: #34758b; }
      .meta { fill: #b7c8d1; }
      .track { stroke: #34758b; }
    }
    @media (prefers-reduced-motion: reduce) {
      .signal-cyan,
      .signal-gold,
      .packet,
      .status {
        animation: none;
      }
    }
  </style>

  <rect class="frame" x="1" y="1" width="1198" height="150" rx="8" />

  <path class="track" d="M282 76 H456 M744 76 H918" />
  <path class="signal-cyan" d="M282 69 H456 M744 69 H918" />
  <path class="signal-gold" d="M282 83 H456 M744 83 H918" />

  <g transform="translate(36 38)">
    <rect class="node" width="246" height="76" rx="6" />
    <circle cx="31" cy="28" r="10" fill="none" stroke="#42d6c5" stroke-width="2" />
    <circle cx="26" cy="25" r="2" fill="#42d6c5" />
    <circle cx="36" cy="25" r="2" fill="#42d6c5" />
    <path d="M24 34 Q31 39 38 34" fill="none" stroke="#42d6c5" stroke-width="2" stroke-linecap="round" />
    <text class="label" x="53" y="31" font-size="17" font-weight="700" letter-spacing="1.4">GITHUB</text>
    <text class="meta" x="20" y="57" font-size="12" letter-spacing="1.1">SOURCE / COLLABORATE</text>
  </g>

  <g transform="translate(456 26)">
    <rect class="node" width="288" height="100" rx="6" />
    <rect x="20" y="20" width="8" height="8" fill="#c7a85a" transform="rotate(45 24 24)" />
    <text class="label" x="42" y="31" font-size="18" font-weight="700" letter-spacing="1.7">PINGSCIENTIST</text>
    <path d="M20 52 H268" stroke="#18374a" />
    <path d="M35 74 H88 L101 61 L116 86 L133 69 L150 78 H253" fill="none" stroke="#42d6c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <circle class="packet" cx="101" cy="61" r="4" fill="#c7a85a" />
    <circle class="status" cx="256" cy="24" r="4" fill="#42d6c5" />
  </g>

  <g transform="translate(918 38)">
    <rect class="node" width="246" height="76" rx="6" />
    <rect x="20" y="19" width="24" height="18" rx="2" fill="none" stroke="#c7a85a" stroke-width="2" />
    <path d="M21 21 L32 30 L43 21" fill="none" stroke="#c7a85a" stroke-width="2" stroke-linejoin="round" />
    <text class="label" x="57" y="31" font-size="17" font-weight="700" letter-spacing="1.4">EMAIL</text>
    <text class="meta" x="20" y="57" font-size="12" letter-spacing="1.1">HELLO / EXCHANGE IDEAS</text>
  </g>
</svg>
