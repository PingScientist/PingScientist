<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 104" role="img" aria-labelledby="title desc">
  <title id="title">Contact signal</title>
  <desc id="desc">Two animated signals travel inward from GitHub and email toward PingScientist.</desc>

  <style>
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .frame { fill: #07111f; stroke: #18374a; }
    .label { fill: #f4f7f8; }
    .meta { fill: #91a9b8; }
    .divider { stroke: #102a3a; }
    .track {
      fill: none;
      stroke: #18374a;
      stroke-width: 1.4;
    }
    .signal-left,
    .signal-right {
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-dasharray: 10 14;
    }
    .signal-left { stroke: #42d6c5; }
    .signal-right { stroke: #c7a85a; }
    .motion-layer { display: inline; }
    .static-layer { display: none; }

    @media (prefers-color-scheme: dark) {
      .frame { fill: #07111f; stroke: #18374a; }
      .label { fill: #f4f7f8; }
      .meta { fill: #91a9b8; }
      .divider { stroke: #102a3a; }
      .track { stroke: #18374a; }
      .signal-left { stroke: #42d6c5; }
      .signal-right { stroke: #c7a85a; }
    }

    @media (prefers-color-scheme: light) {
      .frame { fill: #edf2f3; stroke: #b8cbd2; }
      .label { fill: #152b37; }
      .meta { fill: #526d79; }
      .divider { stroke: #cfdbdf; }
      .track { stroke: #abc0c8; }
      .signal-left { stroke: #087f79; }
      .signal-right { stroke: #8a6a20; }
    }

    @media (prefers-reduced-motion: reduce) {
      .motion-layer { display: none; }
      .static-layer { display: inline; }
    }
  </style>

  <rect class="frame" x="1" y="1" width="1198" height="102" rx="5" />
  <line class="divider" x1="28" y1="18" x2="1172" y2="18" />
  <line class="divider" x1="28" y1="86" x2="1172" y2="86" />

  <path class="track" d="M252 52 C310 42 354 62 406 52 S462 44 492 52" />
  <path class="track" d="M948 52 C890 62 846 42 794 52 S738 60 708 52" />

  <!-- Animated paths are drawn from each outside node toward the center. -->
  <g class="motion-layer">
    <path class="signal-left" d="M252 52 C310 42 354 62 406 52 S462 44 492 52">
      <animate attributeName="stroke-dashoffset" values="0;-96" dur="5s" repeatCount="indefinite" />
      <animate attributeName="d"
        values="M252 52 C310 42 354 62 406 52 S462 44 492 52;
                M252 52 C310 62 354 42 406 52 S462 60 492 52;
                M252 52 C310 42 354 62 406 52 S462 44 492 52"
        dur="7s" repeatCount="indefinite" />
    </path>
    <path class="signal-right" d="M948 52 C890 62 846 42 794 52 S738 60 708 52">
      <animate attributeName="stroke-dashoffset" values="0;-96" dur="5.4s" repeatCount="indefinite" />
      <animate attributeName="d"
        values="M948 52 C890 62 846 42 794 52 S738 60 708 52;
                M948 52 C890 42 846 62 794 52 S738 44 708 52;
                M948 52 C890 62 846 42 794 52 S738 60 708 52"
        dur="7.5s" repeatCount="indefinite" />
    </path>

    <circle cx="252" cy="52" r="4" fill="#42d6c5">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="3.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="492" cy="52" r="4" fill="#42d6c5">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="3s" begin="-1.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="708" cy="52" r="4" fill="#c7a85a">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="3s" begin="-1.2s" repeatCount="indefinite" />
    </circle>
    <circle cx="948" cy="52" r="4" fill="#c7a85a">
      <animate attributeName="opacity" values="0.65;1;0.65" dur="3.6s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Complete static fallback for reduced motion -->
  <g class="static-layer">
    <path class="signal-left" d="M252 52 C310 42 354 62 406 52 S462 44 492 52" />
    <path class="signal-right" d="M948 52 C890 62 846 42 794 52 S738 60 708 52" />
    <circle cx="252" cy="52" r="4" fill="#42d6c5" />
    <circle cx="492" cy="52" r="4" fill="#42d6c5" />
    <circle cx="708" cy="52" r="4" fill="#c7a85a" />
    <circle cx="948" cy="52" r="4" fill="#c7a85a" />
  </g>

  <text class="label" x="56" y="49" font-size="16" font-weight="700" letter-spacing="1.8">GITHUB</text>
  <text class="meta" x="56" y="68" font-size="10" letter-spacing="1.5">SOURCE</text>

  <text class="label" x="516" y="49" font-size="17" font-weight="700" letter-spacing="1.9">PINGSCIENTIST</text>
  <text class="meta" x="516" y="68" font-size="10" letter-spacing="1.5">SIGNAL / OPEN</text>

  <text class="label" x="974" y="49" font-size="16" font-weight="700" letter-spacing="1.8">EMAIL</text>
  <text class="meta" x="974" y="68" font-size="10" letter-spacing="1.5">CONNECT</text>
</svg>
