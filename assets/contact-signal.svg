<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 104" role="img" aria-labelledby="title desc">
  <title id="title">Contact signal</title>
  <desc id="desc">Two restrained signals travel inward from GitHub and email toward PingScientist.</desc>

  <style>
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .frame { fill: #07111f; stroke: #18374a; }
    .label { fill: #f4f7f8; }
    .meta { fill: #91a9b8; }
    .track {
      fill: none;
      stroke: #18374a;
      stroke-width: 1.4;
    }
    .signal-left,
    .signal-right {
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-dasharray: 10 14;
      transform-box: fill-box;
      transform-origin: center;
    }
    .signal-left {
      stroke: #42d6c5;
      animation: flow-in 5s linear infinite, wave-left 7s ease-in-out infinite;
    }
    .signal-right {
      stroke: #c7a85a;
      animation: flow-in 5.4s linear infinite, wave-right 7.5s ease-in-out infinite;
    }
    .node { animation: node-pulse 3s ease-in-out infinite; }
    @keyframes flow-in {
      to { stroke-dashoffset: -96; }
    }
    @keyframes wave-left {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-2px); }
    }
    @keyframes wave-right {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(2px); }
    }
    @keyframes node-pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    @media (prefers-color-scheme: light) {
      .frame { stroke: #2d6377; }
      .meta { fill: #b7c8d1; }
      .track { stroke: #245268; }
    }
    @media (prefers-reduced-motion: reduce) {
      .signal-left,
      .signal-right,
      .node {
        animation: none;
      }
    }
  </style>

  <rect class="frame" x="1" y="1" width="1198" height="102" rx="5" />
  <line x1="28" y1="18" x2="1172" y2="18" stroke="#102a3a" />
  <line x1="28" y1="86" x2="1172" y2="86" stroke="#102a3a" />

  <!-- Paths are drawn from each outside node toward the center. -->
  <path class="track" d="M252 52 C310 45 354 59 406 52 S462 48 492 52" />
  <path class="track" d="M948 52 C890 59 846 45 794 52 S738 56 708 52" />
  <path class="signal-left" d="M252 52 C310 45 354 59 406 52 S462 48 492 52" />
  <path class="signal-right" d="M948 52 C890 59 846 45 794 52 S738 56 708 52" />

  <circle cx="252" cy="52" r="4" fill="#42d6c5" />
  <circle class="node" cx="492" cy="52" r="4" fill="#42d6c5" />
  <circle class="node" cx="708" cy="52" r="4" fill="#c7a85a" />
  <circle cx="948" cy="52" r="4" fill="#c7a85a" />

  <text class="label" x="56" y="49" font-size="16" font-weight="700" letter-spacing="1.8">GITHUB</text>
  <text class="meta" x="56" y="68" font-size="10" letter-spacing="1.5">SOURCE</text>

  <text class="label" x="516" y="49" font-size="17" font-weight="700" letter-spacing="1.9">PINGSCIENTIST</text>
  <text class="meta" x="516" y="68" font-size="10" letter-spacing="1.5">SIGNAL / OPEN</text>

  <text class="label" x="974" y="49" font-size="16" font-weight="700" letter-spacing="1.8">EMAIL</text>
  <text class="meta" x="974" y="68" font-size="10" letter-spacing="1.5">CONNECT</text>
</svg>
