<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 104" role="img" aria-labelledby="title desc">
  <title id="title">Contact signal</title>
  <desc id="desc">A quiet geometric signal linking GitHub, PingScientist, and email.</desc>

  <style>
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .frame { fill: #07111f; stroke: #18374a; }
    .label { fill: #f4f7f8; }
    .meta { fill: #91a9b8; }
    .track { fill: none; stroke: #245268; stroke-width: 1.5; }
    .signal {
      fill: none;
      stroke: #42d6c5;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-dasharray: 10 14;
      animation: signal-flow 4s linear infinite;
    }
    .node { animation: node-pulse 2.8s ease-in-out infinite; }
    @keyframes signal-flow {
      to { stroke-dashoffset: -96; }
    }
    @keyframes node-pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    @media (prefers-color-scheme: light) {
      .frame { stroke: #2d6377; }
      .meta { fill: #b7c8d1; }
      .track { stroke: #34758b; }
    }
    @media (prefers-reduced-motion: reduce) {
      .signal,
      .node {
        animation: none;
      }
    }
  </style>

  <rect class="frame" x="1" y="1" width="1198" height="102" rx="5" />
  <line x1="28" y1="18" x2="1172" y2="18" stroke="#102a3a" />
  <line x1="28" y1="86" x2="1172" y2="86" stroke="#102a3a" />

  <path class="track" d="M252 52 H492 M708 52 H948" />
  <path class="signal" d="M252 52 H492 M708 52 H948" />

  <circle cx="252" cy="52" r="4" fill="#42d6c5" />
  <circle class="node" cx="492" cy="52" r="4" fill="#42d6c5" />
  <rect x="596" y="21" width="10" height="10" fill="#c7a85a" transform="rotate(45 601 26)" />
  <circle class="node" cx="708" cy="52" r="4" fill="#c7a85a" />
  <circle cx="948" cy="52" r="4" fill="#c7a85a" />

  <text class="label" x="56" y="49" font-size="16" font-weight="700" letter-spacing="1.8">GITHUB</text>
  <text class="meta" x="56" y="68" font-size="10" letter-spacing="1.5">SOURCE</text>

  <text class="label" x="516" y="49" font-size="17" font-weight="700" letter-spacing="1.9">PINGSCIENTIST</text>
  <text class="meta" x="516" y="68" font-size="10" letter-spacing="1.5">SIGNAL / OPEN</text>

  <text class="label" x="974" y="49" font-size="16" font-weight="700" letter-spacing="1.8">EMAIL</text>
  <text class="meta" x="974" y="68" font-size="10" letter-spacing="1.5">CONNECT</text>
</svg>
