    .micro { fill: #597480; }
    .quiet { fill: #6d858f; }
    .divider { stroke: #b9ccd3; }
    .grid {
      fill: none;
      stroke: #9bb8c1;
      stroke-width: 1.1;
    }
    .cyan-fill, .particle-cyan { fill: #087f79; }
    .gold-fill, .particle-gold { fill: #8a6a20; }
    .gold-stroke { stroke: #8a6a20; }
    .motion-layer { display: inline; }

