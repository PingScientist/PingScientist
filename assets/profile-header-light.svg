  <title id="title">PING SCIENTIST</title>
  <desc id="desc">An animated scientific header where the title types in, particles expand from a compact core, and a warped coordinate field slowly evolves.</desc>

  <defs>
    <clipPath id="type-ping">
      <rect x="72" y="92" width="0" height="60">
        <animate attributeName="width" values="0;0;38;76;114;152;152;0"
          keyTimes="0;0.02;0.0475;0.075;0.1025;0.13;0.94;1"
          calcMode="discrete" dur="14s" repeatCount="indefinite" />
      </rect>
    </clipPath>
    <clipPath id="type-scientist">
      <rect x="72" y="149" width="0" height="62">
        <animate attributeName="width"
          values="0;0;37;74;111;148;185;222;259;296;330;330;0"
          keyTimes="0;0.13;0.152;0.174;0.196;0.218;0.24;0.262;0.284;0.306;0.33;0.94;1"
          calcMode="discrete" dur="14s" repeatCount="indefinite" />
      </rect>
    </clipPath>
    <clipPath id="type-subtitle">
      <rect x="72" y="238" width="0" height="28">
        <animate attributeName="width" values="0;0;354;354;0"
          keyTimes="0;0.33;0.52;0.94;1" dur="14s" repeatCount="indefinite" />
      </rect>
    </clipPath>
  </defs>

