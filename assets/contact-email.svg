<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" role="img" aria-labelledby="title desc">
  <title id="title">Email</title>
  <desc id="desc">A compact flat button for sending an email to PingScientist.</desc>

  <style>
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .background { fill: #07111f; stroke: #504728; }
    .label { fill: #f4f7f8; }
    @media (prefers-color-scheme: light) {
      .background { stroke: #786832; }
    }
  </style>

  <rect class="background" x="1" y="1" width="278" height="62" rx="5" />
  <line x1="20" y1="18" x2="20" y2="46" stroke="#c7a85a" stroke-width="3" />
  <path d="M35 26 H51 V38 H35 Z M36 27 L43 33 L50 27" fill="none" stroke="#c7a85a" stroke-width="1.8" stroke-linejoin="round" />
  <text class="label" x="62" y="38" font-size="16" font-weight="700" letter-spacing="1.6">EMAIL</text>
  <path d="M246 27 L252 32 L246 37" fill="none" stroke="#c7a85a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
