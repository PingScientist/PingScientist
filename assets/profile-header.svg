<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">PING SCIENTIST</title>
  <desc id="desc">An animated scientific header with slowly interacting particles in a warped coordinate field.</desc>

  <style>
    text {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .grid {
      fill: none;
      stroke: #153246;
      stroke-width: 1.1;
    }
    .motion-layer { display: inline; }
    .static-layer { display: none; }
    @media (prefers-color-scheme: light) {
      .grid { stroke: #1d4359; }
    }
  </style>

  <rect width="1200" height="320" fill="#07111f" />
  <rect x="28" y="28" width="8" height="8" fill="#42d6c5" />
  <text x="48" y="37" fill="#6f8b9b" font-size="12" letter-spacing="2.2">PROFILE / 00</text>
  <line x1="28" y1="55" x2="1172" y2="55" stroke="#18374a" />

  <!-- Animated warped coordinate field -->
  <g class="motion-layer">
    <g class="grid" opacity="0.64">
      <animate attributeName="opacity" values="0.64;0.82;0.64" dur="12s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate"
        values="0 0;-7 3;0 0" dur="12s" repeatCount="indefinite" />
      <path d="M560 88 C684 67 782 114 900 92 S1072 70 1170 88" />
      <path d="M540 134 C676 110 790 163 924 136 S1080 114 1180 134" />
      <path d="M540 184 C680 154 792 216 932 184 S1092 160 1180 180" />
      <path d="M560 236 C690 204 812 263 950 232 S1092 213 1180 226" />
    </g>
    <g class="grid" opacity="0.54">
      <animate attributeName="opacity" values="0.54;0.74;0.54" dur="15s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="skewX"
        values="0;-1.5;0" dur="15s" repeatCount="indefinite" />
      <path d="M620 68 C590 126 650 184 618 270" />
      <path d="M750 65 C720 125 780 185 748 276" />
      <path d="M880 65 C850 125 910 188 878 276" />
      <path d="M1010 65 C980 126 1040 190 1008 270" />
      <path d="M1140 70 C1110 130 1160 188 1136 260" />
    </g>
  </g>

  <!-- Static coordinate field for reduced motion -->
  <g class="static-layer grid" opacity="0.7">
    <path d="M560 88 C684 67 782 114 900 92 S1072 70 1170 88" />
    <path d="M540 134 C676 110 790 163 924 136 S1080 114 1180 134" />
    <path d="M540 184 C680 154 792 216 932 184 S1092 160 1180 180" />
    <path d="M560 236 C690 204 812 263 950 232 S1092 213 1180 226" />
    <path d="M620 68 C590 126 650 184 618 270" />
    <path d="M750 65 C720 125 780 185 748 276" />
    <path d="M880 65 C850 125 910 188 878 276" />
    <path d="M1010 65 C980 126 1040 190 1008 270" />
    <path d="M1140 70 C1110 130 1160 188 1136 260" />
  </g>

  <!-- Animated particles, each with its own rhythm -->
  <g class="motion-layer">
    <circle cx="636" cy="111" r="4" fill="#42d6c5">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;20 -10;7 14;0 0" keyTimes="0;0.34;0.68;1" dur="9s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;1;0.78;0.7" dur="9s" repeatCount="indefinite" />
    </circle>
    <circle cx="714" cy="196" r="3" fill="#f4f7f8">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;-17 12;10 -13;0 0" keyTimes="0;0.38;0.72;1" dur="11s" begin="-2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.55;0.9;0.65;0.55" dur="11s" begin="-2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="778" cy="123" r="4.5" fill="#c7a85a">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;13 15;-14 6;0 0" keyTimes="0;0.3;0.66;1" dur="13s" begin="-5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.72;1;0.78;0.72" dur="13s" begin="-5s" repeatCount="indefinite" />
    </circle>
    <circle cx="842" cy="215" r="3.5" fill="#42d6c5">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;-11 -16;16 7;0 0" keyTimes="0;0.36;0.7;1" dur="10s" begin="-7.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;0.95;0.72;0.6" dur="10s" begin="-7.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="902" cy="98" r="3" fill="#f4f7f8">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;10 -13;-16 11;0 0" keyTimes="0;0.32;0.64;1" dur="12s" begin="-2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;0.85;0.62;0.5" dur="12s" begin="-2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="958" cy="171" r="4" fill="#42d6c5">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;19 -9;8 13;0 0" keyTimes="0;0.34;0.68;1" dur="9.5s" begin="-5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.65;1;0.74;0.65" dur="9.5s" begin="-5s" repeatCount="indefinite" />
    </circle>
    <circle cx="1014" cy="226" r="3" fill="#c7a85a">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;-16 11;9 -12;0 0" keyTimes="0;0.38;0.72;1" dur="11.5s" begin="-7.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.58;0.94;0.68;0.58" dur="11.5s" begin="-7.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="1062" cy="120" r="3.5" fill="#f4f7f8">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;12 14;-13 5;0 0" keyTimes="0;0.3;0.66;1" dur="13.5s" begin="-2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.52;0.88;0.64;0.52" dur="13.5s" begin="-2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="1110" cy="188" r="4" fill="#c7a85a">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;-10 -15;15 6;0 0" keyTimes="0;0.36;0.7;1" dur="10.5s" begin="-5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.64;1;0.76;0.64" dur="10.5s" begin="-5s" repeatCount="indefinite" />
    </circle>
    <circle cx="1160" cy="92" r="2.8" fill="#42d6c5">
      <animateTransform attributeName="transform" type="translate"
        values="0 0;9 -12;-15 10;0 0" keyTimes="0;0.32;0.64;1" dur="12.5s" begin="-7.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.52;0.9;0.66;0.52" dur="12.5s" begin="-7.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Static particles for reduced motion -->
  <g class="static-layer">
    <circle cx="636" cy="111" r="4" fill="#42d6c5" />
    <circle cx="714" cy="196" r="3" fill="#f4f7f8" opacity="0.78" />
    <circle cx="778" cy="123" r="4.5" fill="#c7a85a" />
    <circle cx="842" cy="215" r="3.5" fill="#42d6c5" />
    <circle cx="902" cy="98" r="3" fill="#f4f7f8" opacity="0.72" />
    <circle cx="958" cy="171" r="4" fill="#42d6c5" />
    <circle cx="1014" cy="226" r="3" fill="#c7a85a" />
    <circle cx="1062" cy="120" r="3.5" fill="#f4f7f8" opacity="0.78" />
    <circle cx="1110" cy="188" r="4" fill="#c7a85a" />
    <circle cx="1160" cy="92" r="2.8" fill="#42d6c5" />
  </g>

  <!-- Title block -->
  <g>
    <text x="72" y="142" fill="#f4f7f8" font-size="57" font-weight="750" letter-spacing="4.5">PING</text>
    <text x="72" y="199" fill="#f4f7f8" font-size="57" font-weight="750" letter-spacing="4.5">SCIENTIST</text>
    <line x1="74" y1="222" x2="446" y2="222" stroke="#c7a85a" stroke-width="2" />
    <rect x="453" y="217" width="10" height="10" fill="#c7a85a" transform="rotate(45 458 222)" />
    <text x="72" y="258" fill="#9cb0bb" font-size="16" letter-spacing="2.35">Physics · Scientific Computing · Web</text>
    <rect class="motion-layer" x="449" y="244" width="2" height="18" fill="#42d6c5">
      <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" calcMode="discrete" dur="1.1s" repeatCount="indefinite" />
    </rect>
    <rect class="static-layer" x="449" y="244" width="2" height="18" fill="#42d6c5" />
  </g>

  <text x="72" y="292" fill="#456172" font-size="11" letter-spacing="2">NTHU PHYSICS / MATLAB / FULL-STACK SYSTEMS</text>
</svg>
