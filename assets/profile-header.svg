<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">PING SCIENTIST</title>
  <desc id="desc">An animated scientific header with slowly interacting particles in a warped coordinate field.</desc>

  <style>
    text {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .grid {
      fill: none;
      stroke: #153246;
      stroke-width: 1.1;
    }
    .motion-layer { display: inline; }
    .static-layer { display: none; }
    @media (prefers-color-scheme: light) {
      .grid { stroke: #1d4359; }
    }
  </style>

  <rect width="1200" height="320" fill="#07111f" />
  <rect x="28" y="28" width="8" height="8" fill="#42d6c5" />
  <text x="48" y="37" fill="#6f8b9b" font-size="12" letter-spacing="2.2">PROFILE / 00</text>
  <line x1="28" y1="55" x2="1172" y2="55" stroke="#18374a" />

