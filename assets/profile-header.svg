<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">PING SCIENTIST</title>
  <desc id="desc">A restrained scientific header with a continuous wave, sparse coordinate grid, wireframe sphere, and cube.</desc>

  <style>
    text {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .grid { fill: none; stroke: #153246; stroke-width: 1; }
    .geometry { fill: none; stroke: #2d6377; stroke-width: 1.5; }
    .wave {
      fill: none;
      stroke: #42d6c5;
      stroke-width: 2.6;
      stroke-linecap: round;
      animation: wave-breathe 6s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .orbit {
      fill: none;
      stroke: #c7a85a;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-dasharray: 8 13;
      animation: orbit-flow 7s linear infinite;
    }
    .marker { animation: marker-pulse 3s ease-in-out infinite; }
    .cursor { animation: cursor-blink 1.1s steps(2, end) infinite; }
    @keyframes wave-breathe {
      0%, 100% { transform: translateY(0); opacity: 0.82; }
      50% { transform: translateY(-4px); opacity: 1; }
    }
    @keyframes orbit-flow {
      to { stroke-dashoffset: -84; }
    }
    @keyframes marker-pulse {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 1; }
    }
    @keyframes cursor-blink {
      50% { opacity: 0; }
    }
    @media (prefers-color-scheme: light) {
      .grid { stroke: #1d4359; }
      .geometry { stroke: #34758b; }
    }
    @media (prefers-reduced-motion: reduce) {
      .wave,
      .orbit,
      .marker,
      .cursor {
        animation: none;
      }
    }
  </style>

  <rect width="1200" height="320" fill="#07111f" />
  <rect x="28" y="28" width="8" height="8" fill="#42d6c5" />
  <text x="48" y="37" fill="#6f8b9b" font-size="12" letter-spacing="2.2">PROFILE / 00</text>
  <line x1="28" y1="55" x2="1172" y2="55" stroke="#18374a" />

  <!-- Sparse coordinate field -->
  <g opacity="0.72">
    <path class="grid" d="M560 92 H1168 M560 150 H1168 M560 208 H1168 M620 70 V276 M790 70 V276 M960 70 V276 M1130 70 V276" />
    <path d="M560 266 H1168" stroke="#102a3a" />
  </g>

  <!-- Minimal wireframe geometry -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle class="geometry" cx="850" cy="151" r="67" />
    <ellipse class="geometry" cx="850" cy="151" rx="67" ry="24" />
    <ellipse class="geometry" cx="850" cy="151" rx="24" ry="67" />
    <path d="M789 127 Q850 91 911 127" stroke="#42d6c5" stroke-width="2" />

    <path class="geometry" d="M1020 119 L1080 91 L1140 119 L1080 148 Z
                              M1020 119 V190 L1080 221 L1140 190 V119
                              M1080 148 V221" />
  </g>

  <!-- One supporting trajectory -->
  <path class="orbit" d="M670 225 C744 85 954 57 1148 111" opacity="0.82" />
  <circle class="marker" cx="754" cy="123" r="4" fill="#c7a85a" />

  <!-- One continuous wave path -->
  <path class="wave" d="M520 229
                         C582 190 638 264 704 226
                         C770 188 828 258 895 222
                         C963 185 1037 253 1168 211" />

  <!-- Title block -->
  <g>
    <text x="72" y="142" fill="#f4f7f8" font-size="57" font-weight="750" letter-spacing="4.5">PING</text>
    <text x="72" y="199" fill="#f4f7f8" font-size="57" font-weight="750" letter-spacing="4.5">SCIENTIST</text>
    <line x1="74" y1="222" x2="446" y2="222" stroke="#c7a85a" stroke-width="2" />
    <rect x="453" y="217" width="10" height="10" fill="#c7a85a" transform="rotate(45 458 222)" />
    <text x="72" y="258" fill="#9cb0bb" font-size="16" letter-spacing="2.35">Physics · Scientific Computing · Web</text>
    <rect class="cursor" x="449" y="244" width="2" height="18" fill="#42d6c5" />
  </g>

  <text x="72" y="292" fill="#456172" font-size="11" letter-spacing="2">NTHU PHYSICS / MATLAB / FULL-STACK SYSTEMS</text>
</svg>
