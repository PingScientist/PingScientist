<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 88" role="img" aria-labelledby="title desc">
  <title id="title">GitHub — PingScientist</title>
  <desc id="desc">A local flat button linking to the PingScientist GitHub profile.</desc>

  <style>
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .background { fill: #07111f; stroke: #42d6c5; }
    .primary { fill: #f4f7f8; }
    .secondary { fill: #91a9b8; }
    @media (prefers-color-scheme: light) {
      .background { stroke: #2db9ab; }
      .secondary { fill: #b7c8d1; }
    }
  </style>

  <rect class="background" x="1" y="1" width="358" height="86" rx="8" />
  <g fill="none" stroke="#42d6c5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="45" cy="44" r="17" />
    <circle cx="38" cy="40" r="2" fill="#42d6c5" stroke="none" />
    <circle cx="52" cy="40" r="2" fill="#42d6c5" stroke="none" />
    <path d="M35 50 Q45 57 55 50" />
  </g>
  <line x1="78" y1="18" x2="78" y2="70" stroke="#18374a" />
  <text class="primary" x="100" y="40" font-size="18" font-weight="700" letter-spacing="1.8">GITHUB</text>
  <text class="secondary" x="100" y="62" font-size="13" letter-spacing="1.1">PingScientist</text>
  <path d="M321 38 L329 44 L321 50" fill="none" stroke="#42d6c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
