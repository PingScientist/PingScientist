<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" role="img" aria-labelledby="title desc">
  <title id="title">GitHub</title>
  <desc id="desc">A compact flat button linking to the PingScientist GitHub profile.</desc>

  <style>
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .background { fill: #07111f; stroke: #245268; }
    .label { fill: #f4f7f8; }
    @media (prefers-color-scheme: light) {
      .background { stroke: #34758b; }
    }
  </style>

  <rect class="background" x="1" y="1" width="278" height="62" rx="5" />
  <line x1="20" y1="18" x2="20" y2="46" stroke="#42d6c5" stroke-width="3" />
  <circle cx="43" cy="32" r="7" fill="none" stroke="#42d6c5" stroke-width="2" />
  <text class="label" x="62" y="38" font-size="16" font-weight="700" letter-spacing="1.6">GITHUB</text>
  <path d="M246 27 L252 32 L246 37" fill="none" stroke="#42d6c5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
