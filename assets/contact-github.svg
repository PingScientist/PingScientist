<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 56" role="img" aria-labelledby="title desc">
  <title id="title">GitHub</title>
  <desc id="desc">A compact flat button linking to the PingScientist GitHub profile.</desc>

  <style>
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .background { fill: #07111f; stroke: #245268; }
    .label { fill: #f4f7f8; }
    .accent { fill: none; stroke: #42d6c5; }

    @media (prefers-color-scheme: dark) {
      .background { fill: #07111f; stroke: #245268; }
      .label { fill: #f4f7f8; }
      .accent { stroke: #42d6c5; }
    }

    @media (prefers-color-scheme: light) {
      .background { fill: #edf2f3; stroke: #8fb2bd; }
      .label { fill: #152b37; }
      .accent { stroke: #087f79; }
    }
  </style>

  <rect class="background" x="1" y="1" width="218" height="54" rx="5" />
  <line class="accent" x1="18" y1="15" x2="18" y2="41" stroke-width="3" />
  <circle class="accent" cx="38" cy="28" r="6" stroke-width="2" />
  <text class="label" x="54" y="34" font-size="15" font-weight="700" letter-spacing="1.5">GITHUB</text>
  <path class="accent" d="M194 23 L200 28 L194 33" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
